name: Buildinat Build Engine

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================

      - name: Checkout project
        uses: actions/checkout@v4


      # ==========================================
      # 2. READ + VALIDATE MANIFEST
      # ==========================================

      - name: Read and validate Buildinat manifest
        id: manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          try:
              with open("buildinat.json", "r", encoding="utf-8") as f:
                  data = json.load(f)

          except FileNotFoundError:
              print("ERROR: buildinat.json not found")
              sys.exit(1)

          except json.JSONDecodeError as e:
              print(f"ERROR: Invalid buildinat.json: {e}")
              sys.exit(1)

          if data.get("version") != 1:
              print("ERROR: Unsupported Buildinat manifest version")
              sys.exit(1)

          project = data.get("project", {})
          build = data.get("build", {})

          project_name = project.get("name")
          platform = project.get("platform")

          mode = build.get("mode")
          framework = build.get("framework")
          entry = build.get("entry")

          targets = build.get("target", [])
          artifacts = build.get("artifact", [])

          if not project_name:
              print("ERROR: project.name is required")
              sys.exit(1)

          if platform not in ["android"]:
              print(f"ERROR: Unsupported platform: {platform}")
              sys.exit(1)

          if mode not in ["debug", "release"]:
              print(f"ERROR: Invalid build.mode: {mode}")
              sys.exit(1)

          if framework != "android-gradle":
              print("ERROR: Unsupported Android framework")
              sys.exit(1)

          if not entry:
              print("ERROR: build.entry is required")
              sys.exit(1)

          if not isinstance(targets, list) or not targets:
              print("ERROR: build.target must be a non-empty array")
              sys.exit(1)

          if not isinstance(artifacts, list) or not artifacts:
              print("ERROR: build.artifact must be a non-empty array")
              sys.exit(1)

          for target in targets:
              if target not in ["apk", "aab"]:
                  print(f"ERROR: Unsupported target: {target}")
                  sys.exit(1)

          print("========================================")
          print("BUILDINAT BUILD MANIFEST")
          print("========================================")
          print(f"Project:   {project_name}")
          print(f"Platform:  {platform}")
          print(f"Mode:      {mode}")
          print(f"Framework: {framework}")
          print(f"Entry:     {entry}")
          print(f"Targets:   {targets}")
          print(f"Artifacts: {artifacts}")
          print("========================================")
          print("Manifest validation: SUCCESS")
          print("========================================")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"project_name={project_name}\n")
              f.write(f"platform={platform}\n")
              f.write(f"mode={mode}\n")
              f.write(f"framework={framework}\n")
              f.write(f"entry={entry}\n")
              f.write(
                  "targets=" +
                  json.dumps(targets, separators=(",", ":")) +
                  "\n"
              )
              f.write(
                  "artifacts=" +
                  json.dumps(artifacts, separators=(",", ":")) +
                  "\n"
              )

          PY


      # ==========================================
      # 3. SETUP JDK
      # ==========================================

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # 4. SETUP GRADLE
      # ==========================================

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      # ==========================================
      # 5. RESTORE RELEASE KEYSTORE
      # ==========================================

      - name: Restore Buildinat release keystore
        if: steps.manifest.outputs.mode == 'release'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.BUILDINAT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: BUILDINAT_KEYSTORE_BASE64 is not configured."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/buildinat-release.jks"

          if [ ! -s "$RUNNER_TEMP/buildinat-release.jks" ]; then
            echo "ERROR: Keystore file was not created."
            exit 1
          fi

          echo "BUILDINAT_KEYSTORE_FILE=$RUNNER_TEMP/buildinat-release.jks" >> "$GITHUB_ENV"

          echo "Release keystore restored successfully."


      # ==========================================
      # 6. BUILD DEBUG APK
      # ==========================================

      - name: Build Android Debug APK
        if: |
          steps.manifest.outputs.mode == 'debug' &&
          contains(steps.manifest.outputs.targets, 'apk')
        run: |
          gradle assembleDebug


      # ==========================================
      # 7. BUILD DEBUG AAB
      # ==========================================

      - name: Build Android Debug AAB
        if: |
          steps.manifest.outputs.mode == 'debug' &&
          contains(steps.manifest.outputs.targets, 'aab')
        run: |
          gradle bundleDebug


      # ==========================================
      # 8. BUILD RELEASE APK
      # ==========================================

      - name: Build Android Release APK
        if: |
          steps.manifest.outputs.mode == 'release' &&
          contains(steps.manifest.outputs.targets, 'apk')
        env:
          BUILDINAT_KEYSTORE_PASSWORD: ${{ secrets.BUILDINAT_KEYSTORE_PASSWORD }}
          BUILDINAT_KEY_ALIAS: ${{ secrets.BUILDINAT_KEY_ALIAS }}
          BUILDINAT_KEY_PASSWORD: ${{ secrets.BUILDINAT_KEY_PASSWORD }}
        run: |
          gradle assembleRelease


      # ==========================================
      # 9. BUILD RELEASE AAB
      # ==========================================

      - name: Build Android Release AAB
        if: |
          steps.manifest.outputs.mode == 'release' &&
          contains(steps.manifest.outputs.targets, 'aab')
        env:
          BUILDINAT_KEYSTORE_PASSWORD: ${{ secrets.BUILDINAT_KEYSTORE_PASSWORD }}
          BUILDINAT_KEY_ALIAS: ${{ secrets.BUILDINAT_KEY_ALIAS }}
          BUILDINAT_KEY_PASSWORD: ${{ secrets.BUILDINAT_KEY_PASSWORD }}
        run: |
          gradle bundleRelease


      # ==========================================
      # 10. PREPARE APK
      # ==========================================

      - name: Prepare APK artifacts
        if: contains(steps.manifest.outputs.artifacts, 'apk')
        shell: bash
        run: |
          mkdir -p buildinat-artifacts

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -exec cp {} buildinat-artifacts/ \; \
            2>/dev/null || true


      # ==========================================
      # 11. PREPARE AAB
      # ==========================================

      - name: Prepare AAB artifacts
        if: contains(steps.manifest.outputs.artifacts, 'aab')
        shell: bash
        run: |
          mkdir -p buildinat-artifacts

          find app/build/outputs/bundle \
            -type f \
            -name "*.aab" \
            -exec cp {} buildinat-artifacts/ \; \
            2>/dev/null || true


      # ==========================================
      # 12. VERIFY
      # ==========================================

      - name: Verify Buildinat artifacts
        shell: bash
        run: |
          echo "========================================"
          echo "BUILDINAT ARTIFACTS"
          echo "========================================"

          if [ -d "buildinat-artifacts" ] && \
             [ "$(ls -A buildinat-artifacts 2>/dev/null)" ]; then

            ls -lh buildinat-artifacts

          else

            echo "ERROR: No artifacts were generated."
            exit 1

          fi


      # ==========================================
      # 13. UPLOAD
      # ==========================================

      - name: Upload Buildinat artifacts
        uses: actions/upload-artifact@v4
        with:
          name: buildinat-${{ steps.manifest.outputs.project_name }}-${{ steps.manifest.outputs.mode }}
          path: buildinat-artifacts/
          if-no-files-found: error
