plugins {
    id 'com.android.application'
}

android {
    namespace 'com.buildinat.test'
    compileSdk 35

    defaultConfig {
        applicationId 'com.buildinat.test'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            def keystoreFile = System.getenv("BUILDINAT_KEYSTORE_FILE")

            if (keystoreFile != null) {
                storeFile file(keystoreFile)
                storePassword System.getenv("BUILDINAT_KEYSTORE_PASSWORD")
                keyAlias System.getenv("BUILDINAT_KEY_ALIAS")
                keyPassword System.getenv("BUILDINAT_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
        }

        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
